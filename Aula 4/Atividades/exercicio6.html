<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identificação do Usuário</title>
</head>

<body>

    <b>Identificação do Usuário</b>

    <form>
        <table border="0" cellpadding="5">
            <tr>
                <td>Nome:</td>
                <td><input type="text" name="nome" required></td>
            </tr>
            <tr>
                <td>Senha*:</td>
                <td><input type="password" name="senha" required></td>
            </tr>
            <tr>
                <td>CPF*:</td>
                <td><input type="text" name="cpf" required></td>
            </tr>
            <tr>
                <td>Sexo*</td>
                <td>
                    <input type="radio" name="sexo" value="masculino"> Masculino<br>
                    <input type="radio" name="sexo" value="feminino"> Feminino
                </td>
            </tr>
            <tr>
                <td>Data Nascimento*:</td>
                <td><input type="text" name="data_nascimento" required></td>
            </tr>
            <tr>
                <td>Estado Civil*:</td>
                <td>
                    <select name="estado_civil" required>
                        <option>Solteiro</option>
                        <option>Casado</option>
                        <option>Divorciado</option>
                        <option>Viúvo</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Escolaridade:</td>
                <td>
                    <select name="escolaridade">
                        <option>Ensino Fundamental</option>
                        <option>Ensino Médio</option>
                        <option>Ensino Superior</option>
                        <option>Pós-graduação</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Ocupação Principal:</td>
                <td><input type="text" name="ocupacao_principal"></td>
            </tr>
        </table>
        <br>
        <input type="submit" value="Cadastrar">
        <input type="reset" value="Limpar">
    </form>

</body>

</html>
