<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .textoArialVermelho {
            font-family: Arial;
            color: red;
        }

        .textoTimesVerde {
            font-family: Times New Roman, Times, serif;
            font-size: 22px;
            color: green;
        }

        .textoComicAzulItalico {
            font-family: "Comic Sans MS", cursive, sans-serif;
            font-size: 20px;
            color: blue;
            font-style: italic;
        }

        .fontePaginaAmarela {
            color: yellow;
            font-weight: bold;
            font-size: 14px;
            font-family: Verdana;
        }
    </style>
</head>

<body>
    <h2 class="textoArialVermelho">Fonte Arial vermelha</h2>

    <p class="textoTimesVerde">Fonte Times, tamanho 22, verde</p>

    <p class="textoComicAzulItalico">Fonte Comic Sans, tamanho 20, azul e itálico</p>

    <p class="fontePaginaAmarela">Fonte amarela, negrito, tamanho 14, Verdana</p>
</body>

</html>
